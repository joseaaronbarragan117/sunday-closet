name: Despliegue de Sunday Clóset a GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Descargar repositorio (Checkout)
        uses: actions/checkout@v4

      - name: 2. Configurar entorno Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            sunday-closet-web/package.json
            sunday-closet-dashboard/package.json
            sunday-closet-mobile/package.json

      # ── BUILD: TIENDA ONLINE WEB ──
      - name: 3. Compilar Tienda Online (sunday-closet-web)
        run: |
          cd sunday-closet-web
          npm install
          OUTPUT_MODE=export NEXT_PUBLIC_BASE_PATH="/${{ github.event.repository.name }}/web" npm run build
          cd ..

      # ── BUILD: DASHBOARD ESCRITORIO ──
      - name: 4. Compilar Dashboard Escritorio (sunday-closet-dashboard)
        run: |
          cd sunday-closet-dashboard
          npm install
          if [ -d "app/api" ]; then mv app/api app/_api_temp; fi
          rm -rf .next
          OUTPUT_MODE=export NEXT_PUBLIC_BASE_PATH="/${{ github.event.repository.name }}/dashboard" npm run build
          if [ -d "app/_api_temp" ]; then mv app/_api_temp app/api; fi
          cd ..

      # ── BUILD: DASHBOARD CELULAR ──
      - name: 5. Compilar Dashboard Celular (sunday-closet-mobile)
        run: |
          cd sunday-closet-mobile
          npm install
          if [ -d "app/api" ]; then mv app/api app/_api_temp; fi
          rm -rf .next
          OUTPUT_MODE=export NEXT_PUBLIC_BASE_PATH="/${{ github.event.repository.name }}/mobile" npm run build
          if [ -d "app/_api_temp" ]; then mv app/_api_temp app/api; fi
          cd ..

      # ── ENSAMBLAJE DEL PORTAL UNIFICADO ──
      - name: 6. Ensamblar directorio unificado para GitHub Pages
        run: |
          mkdir -p public_deploy/web public_deploy/dashboard public_deploy/mobile
          
          # Archivo .nojekyll indispensable para que GitHub Pages sirva la carpeta _next/
          touch public_deploy/.nojekyll
          
          # Copiar Portal central y SPA 404 router
          cp portal/index.html public_deploy/index.html
          cp portal/404.html public_deploy/404.html

          # Copiar salidas estáticas
          cp -r sunday-closet-web/out/* public_deploy/web/
          cp -r sunday-closet-dashboard/out/* public_deploy/dashboard/
          cp -r sunday-closet-mobile/out/* public_deploy/mobile/

          # Verificación de integridad estricta: asegurar que index.html exista en cada aplicación
          echo "Verificando existencia de index.html en cada sitio..."
          test -f public_deploy/index.html
          test -f public_deploy/web/index.html
          test -f public_deploy/dashboard/index.html
          test -f public_deploy/mobile/index.html
          echo "✅ Todos los proyectos compilaron y tienen su index.html listo para GitHub Pages!"

      - name: 7. Subir artefacto a GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public_deploy

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 8. Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
